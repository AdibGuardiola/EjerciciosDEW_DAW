<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobador de Atracción de Feria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card h1 {
            font-size: 1.6rem;
            color: #333;
            margin-bottom: 8px;
        }

        .card p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 24px;
        }

        .requirements-box {
            background-color: #f8f9fa;
            border-left: 4px solid #764ba2;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 24px;
            border-radius: 4px;
        }

        .requirements-box ul {
            margin-left: 18px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #764ba2;
        }

        .btn-check {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn-check:hover {
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }

        .btn-check:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-container.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-container.danger {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎡 Comprobador de Atracción</h1>
        <p class="subtitle">Verifica si cumples las condiciones para subir</p>

        <div class="requirements-box">
            <strong>Requisitos de acceso:</strong>
            <ul>
                <li>Edad: Entre 16 y 60 años</li>
                <li>Altura: Entre 1.40 m y 1.90 m</li>
            </ul>
        </div>

        <form id="attractionForm" onsubmit="event.preventDefault(); comprobarAcceso();">
            <div class="form-group">
                <label for="edad">Edad (años):</label>
                <input type="number" id="edad" placeholder="Ej. 25" min="0" max="120" step="1" required>
            </div>

            <div class="form-group">
                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" placeholder="Ej. 1.75" min="0" max="3.00" step="0.01" required>
            </div>

            <button type="button" class="btn-check" onclick="comprobarAcceso()">Comprobar</button>
        </form>

        <div id="resultado" class="result-container"></div>
    </div>

    <script>
        function comprobarAcceso() {
            const edadInput = document.getElementById('edad').value;
            const alturaInput = document.getElementById('altura').value;
            const resultadoDiv = document.getElementById('resultado');

            const edad = parseInt(edadInput, 10);
            const altura = parseFloat(alturaInput);

            if (isNaN(edad) || isNaN(altura)) {
                resultadoDiv.className = "result-container danger";
                resultadoDiv.textContent = '❌ "No cumples los requisitos"';
                return;
            }

            // Validación de condiciones:
            // Edad entre 16 y 60 años inclusive.
            // Altura entre 1.40 m y 1.90 m inclusive.
            const edadValida = edad >= 16 && edad <= 60;
            const alturaValida = altura >= 1.40 && altura <= 1.90;

            if (edadValida && alturaValida) {
                resultadoDiv.className = "result-container success";
                resultadoDiv.textContent = '✅ "Puedes subir a la atracción"';
            } else {
                resultadoDiv.className = "result-container danger";
                resultadoDiv.textContent = '❌ "No cumples los requisitos"';
            }
        }
    </script>

</body>
</html>
